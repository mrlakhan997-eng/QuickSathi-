        :root {

            --secondary: #2f3640;
            --bg-color: #f5f6fa;
            --card-bg: #ffffff;
            --text-color: #333;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 10px;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            overflow: hidden;
            padding-bottom: 25px;
        }
        header {
            background: var(--secondary);
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
        }
        header h1 {
            font-size: 22px;
            margin-bottom: 4px;
        }
        .nav-tabs {
            display: flex;
            background: #f1f2f6;
            margin: 15px;
            border-radius: 10px;
            overflow: hidden;
        }
        .nav-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            color: #718093;
        }
        .nav-tab.active {
            background: var(--secondary);
            color: white;
        }
        .section-content {
            display: none;
            padding: 0 20px;
        }
        .section-content.active {
            display: block;
        }
        .input-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 4px;
            font-size: 12px;
            color: #4b6584;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
        }
        .btn-main {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        /* Duty Toggle Bar */
        .duty-bar {
            background: #f1f2f6;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-radius: 8px;
        }
        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            color: white;
            background: var(--danger);
            cursor: pointer;
        }
        .status-badge.online {
            background: var(--primary);
        }
        /* Order Popup Card */

            background: #fff9fb;
            border: 2px solid var(--primary);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            display: none;
        }

            width: 100%;
            height: 180px;
            border-radius: 8px;
            margin-top: 10px;
            border: 1px solid #ced6e0;
            display: none;
        }
