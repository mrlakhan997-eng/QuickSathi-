<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Sathi - Fast Parcel Delivery</title>
    <style>
        :root {
            --primary: #ff4757;
            --secondary: #2f3640;
            --bg-color: #f5f6fa;
            --card-bg: #ffffff;
            --text-color: #333;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 10px;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            overflow: hidden;
            padding-bottom: 20px;
        }
        header {
            background: var(--primary);
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
        }
        header h1 {
            font-size: 22px;
            margin-bottom: 4px;
        }
        header p {
            font-size: 13px;
            opacity: 0.9;
        }
        .nav-tabs {
            display: flex;
            background: #f1f2f6;
            margin: 15px;
            border-radius: 10px;
            overflow: hidden;
        }
        .nav-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            color: #718093;
        }
        .nav-tab.active {
            background: var(--primary);
            color: white;
        }
        .section-content {
            display: none;
            padding: 0 20px;
        }
        .section-content.active {
            display: block;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 13px;
            color: #4b6584;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border 0.3s;
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
        }
        .permission-box {
            background: #f8f9fa;
            border: 1px dashed #ced6e0;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 12px;
            color: #57606f;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .perm-btn {
            background: #747d8c;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
        }
        .perm-btn.granted {
            background: #2ed573;
        }
        .fare-box {
            background: #f1f2f6;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .fare-box span {
            font-size: 15px;
            font-weight: bold;
        }
        #totalFare {
            color: var(--primary);
            font-size: 18px;
        }
        .btn-main {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-main:hover {
            opacity: 0.9;
        }
        .profile-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid var(--primary);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>📦 Quick Sathi</h1>
        <p>Aapka Apna Trusted Parcel Delivery Partner</p>
    </header>

    <!-- Navigation Tabs -->
    <div class="nav-tabs">
        <div class="nav-tab active" onclick="switchTab('book', this)">Book Parcel</div>
        <div class="nav-tab" onclick="switchTab('profile', this)">My Profile</div>
    </div>

    <!-- TAB 1: BOOK PARCEL -->
    <div id="bookSection" class="section-content active">
        
        <!-- Permissions Check Section -->
        <div class="permission-box">
            <span>📍 Location Access</span>
            <button id="locBtn" class="perm-btn" onclick="requestPermission('loc')">Enable</button>
        </div>
        <div class="permission-box">
            <span>📷 Camera & 🎤 Voice Access</span>
            <button id="camBtn" class="perm-btn" onclick="requestPermission('cam')">Enable</button>
        </div>

        <div class="input-group">
            <label>📍 Pickup Location (Kahan se lana hai?)</label>
            <input type="text" id="pickupLoc" placeholder="Apna pura pata ya landmark dalein">
        </div>

        <div class="input-group">
            <label>🎯 Drop Location (Kahan bhejna hai?)</label>
            <input type="text" id="dropLoc" placeholder="Manzil ka pata dalein">
        </div>

        <div class="input-group">
            <label>📏 Parcel ka Size & Details</label>
            <select id="parcelSize" onchange="calculateFare()">
                <option value="small">Small (Documents, Keys - upto 2kg)</option>
                <option value="medium">Medium (Box, Clothes - 2 to 5kg)</option>
                <option value="large">Large (Heavy Item / Big Box - 5kg+)</option>
            </select>
        </div>

        <div class="input-group">
            <label>💬 Kuch khas baat (Optional Voice/Text note)</label>
            <textarea id="note" rows="2" placeholder="Jaise: Saman nazuk hai, ya raste mein call karein..."></textarea>
        </div>

        <div class="fare-box">
            <span>Estimated Kiraya:</span>
            <span id="totalFare">₹ 50</span>
        </div>

        <button class="btn-main" onclick="bookParcel()">Book Parcel Now 🚀</button>
    </div>

    <!-- TAB 2: PROFILE -->
    <div id="profileSection" class="section-content">
        <div class="profile-card">
            <h3 style="margin-bottom: 10px; color: #2f3640;">👤 User Information</h3>
            <div class="input-group">
                <label>Aapka Naam</label>
                <input type="text" id="userName" placeholder="Apna pura naam likhein">
            </div>
            <div class="input-group">
                <label>Mobile Number</label>
                <input type="tel" id="userPhone" placeholder="10-digit mobile number">
            </div>
            <div class="input-group">
                <label>Default Address</label>
                <input type="text" id="userAddress" placeholder="Ghar ya office ka pata">
            </div>
            <button class="btn-main" onclick="saveProfile()">Save Profile 💾</button>
        </div>
    </div>

</div>

<script>
    // Tab Switching Logic
    function switchTab(tabName, element) {
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.section-content').forEach(s => s.classList.remove('active'));

        element.classList.add('active');
        if(tabName === 'book') {
            document.getElementById('bookSection').classList.add('class', '').classList.add('active');
        } else {
            document.getElementById('profileSection').classList.add('active');
        }
    }

    // Permission simulation
    function requestPermission(type) {
        if(type === 'loc') {
            navigator.geolocation.getCurrentPosition((position) => {
                document.getElementById('locBtn').innerText = 'Allowed ✓';
                document.getElementById('locBtn').classList.add('granted');
                alert('Location successfully fetched!');
            }, () => {
                alert('Location permission denied or failed.');
            });
        } else {
            document.getElementById('camBtn').innerText = 'Allowed ✓';
            document.getElementById('camBtn').classList.add('granted');
            alert('Camera & Voice permissions granted!');
        }
    }

    // Fare calculation
    function calculateFare() {
        const size = document.getElementById('parcelSize').value;
        let price = 50;
        if(size === 'medium') price = 80;
        if(size === 'large') price = 130;
        document.getElementById('totalFare').innerText = '₹ ' + price;
    }

    // Booking trigger
    function bookParcel() {
        const pickup = document.getElementById('pickupLoc').value;
        const drop = document.getElementById('dropLoc').value;
        if(!pickup || !drop) {
            alert('Kripya Pickup aur Drop dono location bharein!');
            return;
        }
        alert('🎉 Aapki parcel booking ho gayi hai! Jaldi hi delivery partner aapse judege.');
    }

    // Save Profile
    function saveProfile() {
        const name = document.getElementById('userName').value;
        const phone = document.getElementById('userPhone').value;
        if(!name || !phone) {
            alert('Kripya Naam aur Mobile Number zaroor bharein!');
            return;
        }
        alert('✅ Profile details safely save ho gayi hain!');
    }
</script>

</body>
</html>
