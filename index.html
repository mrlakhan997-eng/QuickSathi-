<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Sathi - Smart Delivery App</title>
    <style>
        :root {
            --primary: #ff4757;
            --secondary: #2f3640;
            --bg-color: #f5f6fa;
            --card-bg: #ffffff;
            --text-color: #333;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 10px;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            overflow: hidden;
            padding-bottom: 25px;
        }
        header {
            background: var(--primary);
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
        }
        header h1 {
            font-size: 22px;
            margin-bottom: 4px;
        }
        header p {
            font-size: 13px;
            opacity: 0.9;
        }
        .nav-tabs {
            display: flex;
            background: #f1f2f6;
            margin: 15px;
            border-radius: 10px;
            overflow: hidden;
        }
        .nav-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            color: #718093;
        }
        .nav-tab.active {
            background: var(--primary);
            color: white;
        }
        .section-content {
            display: none;
            padding: 0 20px;
        }
        .section-content.active {
            display: block;
        }
        .input-group {
            margin-bottom: 15px;
            position: relative;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 13px;
            color: #4b6584;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border 0.3s;
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
        }
        .gps-btn {
            background: #2ed573;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            font-size: 11px;
            cursor: pointer;
            margin-top: 5px;
            display: inline-block;
        }
        /* Suggestions Dropdown */
        .suggestions-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #dcdde1;
            border-top: none;
            border-radius: 0 0 8px 8px;
            max-height: 150px;
            overflow-y: auto;
            z-index: 10;
            display: none;
        }
        .suggestion-item {
            padding: 10px;
            font-size: 13px;
            cursor: pointer;
            border-bottom: 1px solid #f1f2f6;
        }
        .suggestion-item:hover {
            background-color: #f8f9fa;
        }
        /* Mini Map Box */
        .map-box {
            width: 100%;
            height: 110px;
            background: #dfe4ea;
            border-radius: 8px;
            margin-top: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #57606f;
            font-size: 12px;
            border: 1px dashed #ced6e0;
            background-image: linear-gradient(45deg, #f1f2f6 25%, transparent 25%), linear-gradient(-45deg, #f1f2f6 25%, transparent 25%);
            background-size: 20px 20px;
        }
        .fare-box {
            background: #f1f2f6;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .fare-box span {
            font-size: 15px;
            font-weight: bold;
        }
        #totalFare {
            color: var(--primary);
            font-size: 18px;
        }
        .btn-main {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        .btn-main:hover {
            opacity: 0.9;
        }
        .profile-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid var(--primary);
        }
        .otp-display {
            background: #fff0f1;
            border: 1px dashed var(--primary);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-top: 15px;
            display: none;
        }
        .otp-display h3 {
            color: var(--primary);
            font-size: 18px;
            letter-spacing: 2px;
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>📦 Quick Sathi</h1>
        <p>Aapka Apna Smart Delivery Partner</p>
    </header>

    <!-- Navigation Tabs -->
    <div class="nav-tabs">
        <div class="nav-tab active" onclick="switchTab('book', this)">Book Parcel</div>
        <div class="nav-tab" onclick="switchTab('profile', this)">My Profile</div>
    </div>

    <!-- TAB 1: BOOK PARCEL -->
    <div id="bookSection" class="section-content active">
        
        <!-- Pickup Location with Auto-suggest & GPS -->
        <div class="input-group">
            <label>📍 Pickup Location (Kahan se lana hai?)</label>
            <input type="text" id="pickupLoc" placeholder="City ya area ka naam likhein..." oninput="showSuggestions(this.value, 'pickup')" autocomplete="off">
            <div id="pickupSuggestions" class="suggestions-list"></div>
            <button class="gps-btn" onclick="useCurrentLocation('pickup')">📍 Use My Current Location</button>
            <div class="map-box" id="pickupMap">🗺️ Pickup Map Preview</div>
        </div>

        <!-- Drop Location with Auto-suggest -->
        <div class="input-group">
            <label>🎯 Drop Location (Kahan bhejna hai?)</label>
            <input type="text" id="dropLoc" placeholder="Manzil city ya area likhein..." oninput="showSuggestions(this.value, 'drop')" autocomplete="off">
            <div id="dropSuggestions" class="suggestions-list"></div>
            <div class="map-box" id="dropMap">🗺️ Drop Destination Map</div>
        </div>

        <div class="input-group">
            <label>📏 Parcel ka Size & Details</label>
            <select id="parcelSize" onchange="calculateFare()">
                <option value="small">Small (Documents, Keys - upto 2kg)</option>
                <option value="medium">Medium (Box, Clothes - 2 to 5kg)</option>
                <option value="large">Large (Heavy Item / Big Box - 5kg+)</option>
            </select>
        </div>

        <div class="fare-box">
            <span>Estimated Kiraya:</span>
            <span id="totalFare">₹ 50</span>
        </div>

        <button class="btn-main" onclick="bookParcel()">Book Parcel & Get Secure OTP 🚀</button>

        <!-- Secure Delivery OTP Box -->
        <div id="otpBox" class="otp-display">
            <span style="font-size: 13px; font-weight: 600; color: #333;">🔒 Delivery Security OTP:</span>
            <h3 id="generatedOtp">----</h3>
            <p style="font-size: 11px; color: #666; margin-top: 4px;">Parcel deliver hote waqt delivery boy ko ye OTP batayein.</p>
        </div>
    </div>

    <!-- TAB 2: PROFILE -->
    <div id="profileSection" class="section-content">
        <div class="profile-card">
            <h3 style="margin-bottom: 10px; color: #2f3640;">👤 User Profile</h3>
            <div class="input-group">
                <label>Aapka Naam</label>
                <input type="text" id="userName" placeholder="Apna pura naam likhein">
            </div>
            <div class="input-group">
                <label>Mobile Number</label>
                <input type="tel" id="userPhone" placeholder="10-digit mobile number">
            </div>
            <button class="btn-main" onclick="saveProfile()">Save Profile 💾</button>
        </div>
    </div>

</div>

<script>
    // Sample Cities / Locations for auto-suggest
    const locationsList = [
        "Indore - AB Road", "Indore - Vijay Nagar", "Indore - Rajwada", "Indore - Bhanwarkuan",
        "Bhopal - MP Nagar", "Bhopal - New Market", "Bhopal - Lalghati",
        "Khargone - Bus Stand", "Khargone - Gogawa Road", "Dhamnod - Main Market",
        "Ujjain - Freeganj", "Dewas - AB Road", "Mumbai - Andheri", "Delhi - Connaught Place"
    ];

    // Tab Switching Logic
    function switchTab(tabName, element) {
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.section-content').forEach(s => s.classList.remove('active'));

        element.classList.add('active');
        if(tabName === 'book') {
            document.getElementById('bookSection').classList.add('active');
        } else {
            document.getElementById('profileSection').classList.add('active');
        }
    }

    // Auto-suggest cities search bar logic
    function showSuggestions(val, type) {
        const listId = type === 'pickup' ? 'pickupSuggestions' : 'dropSuggestions';
        const listDiv = document.getElementById(listId);
        
        if(!val) {
            listDiv.style.display = 'none';
            return;
        }

        const filtered = locationsList.filter(item => item.toLowerCase().includes(val.toLowerCase()));
        
        if(filtered.length > 0) {
            let html = '';
            filtered.forEach(city => {
                html += `<div class="suggestion-item" onclick="selectCity('${city}', '${type}')">${city}</div>`;
            });
            listDiv.innerHTML = html;
            listDiv.style.display = 'block';
        } else {
            listDiv.style.display = 'none';
        }
    }

    function selectCity(cityName, type) {
        if(type === 'pickup') {
            document.getElementById('pickupLoc').value = cityName;
            document.getElementById('pickupSuggestions').style.display = 'none';
            document.getElementById('pickupMap').innerHTML = '📍 Map Loaded for: ' + cityName;
        } else {
            document.getElementById('dropLoc').value = cityName;
            document.getElementById('dropSuggestions').style.display = 'none';
            document.getElementById('dropMap').innerHTML = '🎯 Map Loaded for: ' + cityName;
        }
    }

    // Use Current GPS Location
    function useCurrentLocation(type) {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((position) => {
                const lat = position.coords.latitude.toFixed(4);
                const lon = position.coords.longitude.toFixed(4);
                const locText = `Current GPS Location (${lat}, ${lon})`;
                
                if(type === 'pickup') {
                    document.getElementById('pickupLoc').value = locText;
                    document.getElementById('pickupMap').innerHTML = '📍 Live GPS Map Active (' + lat + ', ' + lon + ')';
                }
                alert('GPS Location successfully fetched!');
            }, () => {
                alert('Location access denied or unavailable.');
            });
        } else {
            alert('Geolocation is not supported by your browser.');
        }
    }

    // Fare calculation
    function calculateFare() {
        const size = document.getElementById('parcelSize').value;
        let price = 50;
        if(size === 'medium') price = 80;
        if(size === 'large') price = 130;
        document.getElementById('totalFare').innerText = '₹ ' + price;
    }

    // Booking trigger with Secure OTP generation
    function bookParcel() {
        const pickup = document.getElementById('pickupLoc').value;
        const drop = document.getElementById('dropLoc').value;
        if(!pickup || !drop) {
            alert('Kripya Pickup aur Drop dono locations select karein!');
            return;
        }

        // Generate 4 digit random OTP
        const randomOtp = Math.floor(1000 + Math.random() * 9000);
        document.getElementById('generatedOtp').innerText = randomOtp;
        document.getElementById('otpBox').style.display = 'block';

        alert('🎉 Booking Successful! Delivery verification ke liye OTP generate ho gaya hai.');
    }

    // Save Profile
    function saveProfile() {
        const name = document.getElementById('userName').value;
        const phone = document.getElementById('userPhone').value;
        if(!name || !phone) {
            alert('Kripya Naam aur Mobile Number zaroor bharein!');
            return;
        }
        alert('✅ Profile details safely save ho gayi hain!');
    }
</script>

</body>
</html>
