<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Sathi - Customer App</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        /* Full Screen Live Map */
        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        /* Top Brand Bar */
        .top-bar {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            z-index: 10;
            background: white;
            padding: 12px 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .top-bar h2 {
            font-size: 18px;
            color: #2f3640;
        }
        .profile-btn {
            background: #f1f2f6;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            color: #2f3640;
        }
        /* Bottom Booking Sheet (Rapido Style) */
        .bottom-sheet {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            background: white;
            border-top-left-radius: 25px;
            border-top-right-radius: 25px;
            padding: 20px;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.15);
            max-height: 70vh;
            overflow-y: auto;
        }
        .sheet-handle {
            width: 40px;
            height: 4px;
            background: #dcdde1;
            border-radius: 2px;
            margin: 0 auto 15px auto;
        }
        .input-box {
            display: flex;
            align-items: center;
            background: #f8f9fa;
            border: 1px solid #dcdde1;
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 12px;
        }
        .input-box span {
            font-size: 18px;
            margin-right: 10px;
        }
        .input-box input {
            border: none;
            background: transparent;
            width: 100%;
            outline: none;
            font-size: 14px;
            color: #333;
        }
        .service-type {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .service-card {
            flex: 1;
            border: 2px solid #dcdde1;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .service-card.selected {
            border-color: #ff4757;
            background: #fff5f6;
        }
        .service-card h4 {
            font-size: 13px;
            color: #2f3640;
        }
        .service-card p {
            font-size: 11px;
            color: #718093;
            margin-top: 2px;
        }
        .btn-book {
            width: 100%;
            background: #ff4757;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.3);
        }
        /* Searching Overlay */
        .searching-box {
            display: none;
            text-align: center;
            padding: 15px 0;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #ff4757;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Full Screen Map -->
    <div id="map"></div>

    <!-- Top Header Bar -->
    <div class="top-bar">
        <h2>📦 Quick Sathi</h2>
        <button class="profile-btn" onclick="openProfile()">👤 Profile</button>
    </div>

    <!-- Bottom Booking Sheet -->
    <div class="bottom-sheet" id="bottomSheet">
        <div class="sheet-handle"></div>
        
        <div id="bookingForm">
            <h3 style="font-size: 16px; margin-bottom: 15px; color: #2f3640;">Kahan bhejna hai parcel? 🚀</h3>
            
            <div class="input-box">
                <span>📍</span>
                <input type="text" id="pickup" placeholder="Pickup Location (e.g. Vijay Nagar)">
            </div>

            <div class="input-box">
                <span>🎯</span>
                <input type="text" id="drop" placeholder="Drop Location (e.g. Rajwada)">
            </div>

            <label style="font-size: 12px; font-weight: bold; color: #718093; display: block; margin-bottom: 8px;">Vehicle / Service Type:</label>
            <div class="service-type">
                <div class="service-card selected" onclick="selectService(this, 50)">
                    <h4>🛵 Bike Delivery</h4>
                    <p>Upto 2kg • ₹50</p>
                </div>
                <div class="service-card" onclick="selectService(this, 90)">
                    <h4>📦 Mini Box</h4>
                    <p>Upto 5kg • ₹90</p>
                </div>
            </div>

            <button class="btn-book" onclick="startBooking()">Book Delivery Now 🚀</button>
        </div>

        <!-- Searching State (Rapido Style Radar) -->
        <div id="searchingState" class="searching-box">
            <div class="spinner"></div>
            <h3 style="color: #2f3640; font-size: 16px; margin-bottom: 5px;">Aas-paas Delivery Partner khoje ja rahe hain...</h3>
            <p style="color: #718093; font-size: 12px; margin-bottom: 15px;">Kripya thoda intezaar karein 🛵</p>
            <button class="btn-book" style="background: #2f3640;" onclick="cancelBooking()">Cancel Booking</button>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize Map centered at Indore
        const map = L.map('map', {zoomControl: false}).setView([22.7196, 75.8577], 14);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Add dummy driver markers around Indore to look like Rapido/Uber
        const driverIcon = L.divIcon({
            html: '🛵',
            className: 'custom-marker',
            iconSize: [30, 30]
        });

        L.marker([22.7240, 75.8830], {icon: driverIcon}).addTo(map).bindPopup('Quick Sathi Partner (Online)');
        L.marker([22.7100, 75.8450], {icon: driverIcon}).addTo(map).bindPopup('Quick Sathi Partner (Online)');
        L.marker([22.7280, 75.8500], {icon: driverIcon}).addTo(map).bindPopup('Quick Sathi Partner (Online)');

        let selectedFare = 50;

        function selectService(element, fare) {
            document.querySelectorAll('.service-card').forEach(c => c.classList.remove('selected'));
            element.classList.add('selected');
            selectedFare = fare;
        }

        function startBooking() {
            const pickup = document.getElementById('pickup').value;
            const drop = document.getElementById('drop').value;

            if(!pickup || !drop) {
                alert('Kripya Pickup aur Drop location dono enter karein!');
                return;
            }

            document.getElementById('bookingForm').style.display = 'none';
            document.getElementById('searchingState').style.display = 'block';

            // Simulate finding driver after 4 seconds
            setTimeout(() => {
                alert('🎉 Partner Found! Rahul Verma (Partner) ne aapka order accept kar liya hai.');
                document.getElementById('searchingState').style.display = 'none';
                document.getElementById('bookingForm').style.display = 'block';
            }, 4000);
        }

        function cancelBooking() {
            document.getElementById('searchingState').style.display = 'none';
            document.getElementById('bookingForm').style.display = 'block';
        }

        function openProfile() {
            alert('👤 Profile: Lakhan Chouhan\n📞 +91 9876543210\n📍 Indore, MP');
        }
    </script>
</body>
</html>
