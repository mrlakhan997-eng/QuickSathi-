<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Sathi - Customer App</title>
    <!-- Leaflet CSS for Live Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --primary: #ff4757;
            --secondary: #2f3640;
            --bg-color: #f5f6fa;
            --card-bg: #ffffff;
            --text-color: #333;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 10px;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            overflow: hidden;
            padding-bottom: 25px;
        }
        header {
            background: var(--primary);
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
        }
        header h1 {
            font-size: 22px;
            margin-bottom: 4px;
        }
        .nav-tabs {
            display: flex;
            background: #f1f2f6;
            margin: 15px;
            border-radius: 10px;
            overflow: hidden;
        }
        .nav-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            color: #718093;
        }
        .nav-tab.active {
            background: var(--primary);
            color: white;
        }
        .section-content {
            display: none;
            padding: 0 20px;
        }
        .section-content.active {
            display: block;
        }
        .input-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 4px;
            font-size: 12px;
            color: #4b6584;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
        }
        .btn-main {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .map-box {
            width: 100%;
            height: 180px;
            border-radius: 8px;
            margin-top: 10px;
            border: 1px solid #ced6e0;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>📦 Quick Sathi</h1>
        <p>Aapka Apna Smart Live Delivery Partner</p>
    </header>

    <div class="nav-tabs">
        <div class="nav-tab active" onclick="switchTab('book', this)">Book Parcel</div>
        <div class="nav-tab" onclick="switchTab('profile', this)">My Profile</div>
    </div>

    <!-- BOOK PARCEL TAB -->
    <div id="bookSection" class="section-content active">
        <div class="input-group">
            <label>Pickup Location (Kahan se lana hai?)</label>
            <input type="text" id="pickupLoc" placeholder="Vijay Nagar, Indore">
        </div>

        <div class="input-group">
            <label>Drop Location (Kahan bhejna hai?)</label>
            <input type="text" id="dropLoc" placeholder="Rajwada, Indore">
        </div>

        <div class="input-group">
            <label>Parcel ka Size & Details</label>
            <select id="parcelSize">
                <option value="50">Small (Documents, Keys - upto 2kg) - ₹50</option>
                <option value="90">Medium (Box, Clothes - upto 5kg) - ₹90</option>
                <option value="150">Large (Heavy items - upto 10kg) - ₹150</option>
            </select>
        </div>

        <!-- Live Map Preview for Customer -->
        <label>Live Route Preview:</label>
        <div id="customerMap" class="map-box"></div>

        <button class="btn-main" onclick="bookParcel()">Book Delivery Now 🚀</button>
    </div>

    <!-- PROFILE TAB -->
    <div id="profileSection" class="section-content">
        <div style="text-align: center; padding: 20px 0;">
            <div style="font-size: 50px; margin-bottom: 10px;">👤</div>
            <h3 style="color: var(--secondary);">Lakhan Chouhan</h3>
            <p style="color: #718093; font-size: 13px; margin-top: 5px;">📞 +91 9876543210</p>
            <p style="color: #718093; font-size: 13px;">📍 Indore, Madhya Pradesh</p>
        </div>
        <div style="background: #f8f9fa; padding: 15px; border-radius: 10px; margin-top: 10px;">
            <p style="font-size: 13px; font-weight: 600; margin-bottom: 5px;">📜 Booking History</p>
            <p style="font-size: 12px; color: #666;">Abhi tak koi purani booking nahi hai.</p>
        </div>
    </div>

</div>

<!-- Leaflet JS for Map -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    let customerMap;

    function switchTab(tabName, element) {
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.section-content').forEach(s => s.classList.remove('active'));
        
        element.classList.add('active');
        if(tabName === 'book') {
            document.getElementById('bookSection').classList.add('active');
            if(customerMap) customerMap.invalidateSize();
        } else {
            document.getElementById('profileSection').classList.add('active');
        }
    }

    // Initialize Leaflet Map on load
    window.onload = function() {
        customerMap = L.map('customerMap').setView([22.7196, 75.8577], 13); // Indore Coordinates
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(customerMap);

        L.marker([22.7196, 75.8577]).addTo(customerMap)
            .bindPopup('<b>Quick Sathi Hub</b> - Indore').openPopup();
    };

    function bookParcel() {
        const pickup = document.getElementById('pickupLoc').value;
        const drop = document.getElementById('dropLoc').value;

        if(!pickup || !drop) {
            alert('Kripya Pickup aur Drop location dono bharein!');
            return;
        }

        alert('🎉 Parcel Successfully Booked! Delivery Partner jald hi aapse contact karega.');
    }
</script>

</body>
</html>
