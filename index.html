<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Sathi - Customer App</title>
    <!-- Leaflet CSS for Live Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f5f6fa;
        }
        /* Full Screen Map */
        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        /* Top Header & Search Bar */
        .top-container {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            z-index: 10;
        }
        .search-box {
            background: white;
            padding: 14px 18px;
            border-radius: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            cursor: pointer;
        }
        .search-box span {
            font-size: 18px;
            margin-right: 12px;
        }
        .search-box input {
            border: none;
            outline: none;
            font-size: 15px;
            width: 100%;
            background: transparent;
            color: #333;
            font-weight: 500;
        }
        /* Bottom Navigation Bar (Rapido Style) */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
        }
        .nav-item {
            text-align: center;
            cursor: pointer;
            color: #718093;
            font-size: 12px;
            font-weight: 600;
        }
        .nav-item.active {
            color: #ff4757;
        }
        .nav-item div {
            font-size: 20px;
            margin-bottom: 2px;
        }
        /* Booking / Parcel Modal */
        .modal-sheet {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 20;
            background: white;
            border-top-left-radius: 25px;
            border-top-right-radius: 25px;
            padding: 20px;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.2);
            display: none;
            max-height: 80vh;
            overflow-y: auto;
        }
        .sheet-handle {
            width: 40px;
            height: 4px;
            background: #dcdde1;
            border-radius: 2px;
            margin: 0 auto 15px auto;
        }
        .input-group {
            background: #f8f9fa;
            border: 1px solid #dcdde1;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
        }
        .input-group input {
            border: none;
            background: transparent;
            width: 100%;
            outline: none;
            font-size: 14px;
            margin-left: 8px;
        }
        .btn-main {
            width: 100%;
            background: #ff4757;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        /* Profile Drawer */
        .profile-drawer {
            position: absolute;
            top: 0;
            left: -100%;
            width: 80%;
            height: 100%;
            background: white;
            z-index: 30;
            box-shadow: 5px 0 25px rgba(0,0,0,0.2);
            transition: 0.3s ease;
            padding: 20px;
            overflow-y: auto;
        }
        .profile-drawer.open {
            left: 0;
        }
        .profile-header {
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }
        .menu-item {
            padding: 12px 0;
            border-bottom: 1px solid #f1f2f6;
            font-size: 14px;
            font-weight: 600;
            color: #2f3640;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <!-- Full Screen Live Map -->
    <div id="map"></div>

    <!-- Top Search Bar -->
    <div class="top-container">
        <div class="search-box" onclick="openBookingSheet()">
            <span>🔍</span>
            <input type="text" placeholder="Where do you want to send parcel?" readonly>
        </div>
    </div>

    <!-- Bottom Navigation Bar (Video jaisa) -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home')">
            <div>🛵</div>Ride
        </div>
        <div class="nav-item" onclick="openParcelModal()">
            <div>📦</div>Parcel
        </div>
        <div class="nav-item" onclick="openProfileDrawer()">
            <div>👤</div>Profile
        </div>
    </div>

    <!-- Parcel Booking Sheet -->
    <div id="bookingSheet" class="modal-sheet">
        <div class="sheet-handle" onclick="closeBookingSheet()"></div>
        <h3 style="margin-bottom: 15px; color: #2f3640;">📦 Send Parcel via QuickSathi</h3>
        
        <div class="input-group">
            <span>📍</span>
            <input type="text" id="pickup" placeholder="Pickup Location (e.g. Mahalaxmi Nagar)">
        </div>

        <div class="input-group">
            <span>🎯</span>
            <input type="text" id="drop" placeholder="Drop Location (e.g. Rajwada)">
        </div>

        <div style="background: #fff9fb; border: 1px solid #ff4757; padding: 12px; border-radius: 10px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h4 style="font-size: 14px; color: #ff4757;">Parcel on Bike</h4>
                <p style="font-size: 11px; color: #718093;">Upto 2 kgs • 3 mins away</p>
            </div>
            <h3 style="color: #2f3640;">₹ 50</h3>
        </div>

        <button class="btn-main" onclick="confirmBooking()">Book Delivery Partner 🚀</button>
    </div>

    <!-- Profile Drawer (Video jaisa Profile section) -->
    <div id="profileDrawer" class="profile-drawer">
        <div style="text-align: right;"><span onclick="closeProfileDrawer()" style="font-size: 20px; cursor: pointer;">❌</span></div>
        <div class="profile-header">
            <h3 style="color: #2f3640; font-size: 18px;">Lakhan Chouhan</h3>
            <p style="color: #718093; font-size: 13px; margin-top: 4px;">📞 +91 9876543210</p>
            <div style="background: #fff3cd; color: #856404; padding: 4px 8px; border-radius: 6px; display: inline-block; font-size: 12px; margin-top: 8px; font-weight: bold;">⭐ 4.78 My Rating</div>
        </div>
        
        <div class="menu-item" onclick="alert('Booking History: No active rides')"><span>📜 My Rides</span> <span>›</span></div>
        <div class="menu-item" onclick="alert('Payment & Wallet: ₹0 Balance')"><span>💳 Payment</span> <span>›</span></div>
        <div class="menu-item" onclick="alert('Safety Toolkit enabled')"><span>🛡️ Safety</span> <span>›</span></div>
        <div class="menu-item" onclick="alert('Refer & Earn ₹50')"><span>🎁 Refer and Earn</span> <span>›</span></div>
        <div class="menu-item" onclick="alert('Settings & Account Info')"><span>⚙️ Settings</span> <span>›</span></div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize Map centered at Indore
        const map = L.map('map', {zoomControl: false}).setView([22.7196, 75.8577], 14);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Dummy delivery partner markers on map
        const bikeIcon = L.divIcon({ html: '🛵', className: '', iconSize: [25, 25] });
        L.marker([22.7240, 75.8830], {icon: bikeIcon}).addTo(map);
        L.marker([22.7100, 75.8450], {icon: bikeIcon}).addTo(map);
        L.marker([22.7280, 75.8500], {icon: bikeIcon}).addTo(map);

        function openBookingSheet() {
            document.getElementById('bookingSheet').style.display = 'block';
        }
        function closeBookingSheet() {
            document.getElementById('bookingSheet').style.display = 'none';
        }
        function openParcelModal() {
            document.getElementById('bookingSheet').style.display = 'block';
        }
        function openProfileDrawer() {
            document.getElementById('profileDrawer').classList.add('open');
        }
        function closeProfileDrawer() {
            document.getElementById('profileDrawer').classList.remove('open');
        }
        function switchTab(tab) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }

        function confirmBooking() {
            const pickup = document.getElementById('pickup').value;
            const drop = document.getElementById('drop').value;
            if(!pickup || !drop) {
                alert('Kripya Pickup aur Drop location bharein!');
                return;
            }
            alert('🎉 Booking Successful! QuickSathi partner aapka parcel lene aa raha hai.');
            closeBookingSheet();
        }
    </script>
</body>
</html>
