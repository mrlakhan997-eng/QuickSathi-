<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Heavy Driver 3D - Indore Edition</title>
    <!-- Three.js 3D Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; user-select: none; }
        body { background: #000; overflow: hidden; width: 100vw; height: 100vh; }

        /* HUD */
        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            z-index: 10;
            pointer-events: none;
        }
        .hud-box {
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 10px 18px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            border: 2px solid #ff4757;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* Mobile Touch Controls */
        #controls {
            position: absolute;
            bottom: 25px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            z-index: 15;
        }
        .ctrl-btn {
            width: 75px;
            height: 75px;
            background: rgba(255, 71, 87, 0.85);
            color: white;
            border: 3px solid white;
            border-radius: 50%;
            font-size: 30px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0,0,0,0.5);
        }
        .ctrl-btn:active { transform: scale(0.9); background: #ff6b81; }

        /* Overlay Screens */
        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 15, 25, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .btn-start {
            background: linear-gradient(45deg, #2ed573, #1e90ff);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 30px;
            margin-top: 20px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(46, 213, 115, 0.4);
        }
    </style>
</head>
<body>

    <div id="hud">
        <div class="hud-box">🏁 Score: <span id="scoreVal">0</span></div>
        <div class="hud-box">🏆 Best: <span id="highVal">0</span></div>
    </div>

    <!-- Start Screen -->
    <div id="startScreen" class="overlay">
        <h1 style="font-size: 38px; color: #ff4757; text-shadow: 2px 2px 10px rgba(255,71,87,0.5);">HEAVY DRIVER 3D</h1>
        <p style="color: #dfe4ea; font-size: 15px; margin-top: 8px;">3D हाईवे पर ट्रैफिक से बचकर निकलें!</p>
        <p style="color: #a4b0be; font-size: 12px; margin-top: 5px;">(Keyboard Arrows या नीचे दिए बटनों से कंट्रोल करें)</p>
        <button class="btn-start" onclick="startGame()">START 3D RACE 🚀</button>
    </div>

    <!-- Game Over Screen -->
    <div id="gameOverScreen" class="overlay" style="display: none;">
        <h2 style="font-size: 34px; color: #ff4757;">CRASHED! 💥</h2>
        <p style="font-size: 20px; margin-top: 10px;">Your Score: <span id="finalScore" style="color: #2ed573; font-weight: bold;">0</span></p>
        <p id="funnyDialogue" style="color: #eccc68; font-size: 14px; margin-top: 8px;">अरे भैया, 3D में भी ठोक दी!</p>
        <button class="btn-start" onclick="startGame()">PLAY AGAIN 🔄</button>
    </div>

    <!-- Touch Buttons -->
    <div id="controls">
        <div class="ctrl-btn" ontouchstart="moveLeft()" onclick="moveLeft()">◀</div>
        <div class="ctrl-btn" ontouchstart="moveRight()" onclick="moveRight()">▶</div>
    </div>

    <script>
        // 1. Setup 3D Scene, Camera, Renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Sky Blue
        scene.fog = new THREE.Fog(0x87CEEB, 20, 90);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 4.5, 8);
        camera.lookAt(0, 0, -5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // 2. Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // 3. Create 3D Road & Grass
        const roadGeo = new THREE.PlaneGeometry(10, 200);
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x2f3542 });
        const road = new THREE.Mesh(roadGeo, roadMat);
        road.rotation.x = -Math.PI / 2;
        road.position.z = -70;
        road.receiveShadow = true;
        scene.add(road);

        // Green Ground on Sides
        const grassGeo = new THREE.PlaneGeometry(100, 200);
        const grassMat = new THREE.MeshStandardMaterial({ color: 0x2ed573 });
        const grass = new THREE.Mesh(grassGeo, grassMat);
        grass.rotation.x = -Math.PI / 2;
        grass.position.set(0, -0.05, -70);
        scene.add(grass);

        // Road White Stripes
        const stripes = [];
        const stripeGeo = new THREE.PlaneGeometry(0.25, 3);
        const stripeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        for (let z = 10; z > -150; z -= 8) {
            let s1 = new THREE.Mesh(stripeGeo, stripeMat);
            s1.rotation.x = -Math.PI / 2;
            s1.position.set(-1.6, 0.02, z);
            scene.add(s1);

            let s2 = new THREE.Mesh(stripeGeo, stripeMat);
            s2.rotation.x = -Math.PI / 2;
            s2.position.set(1.6, 0.02, z);
            scene.add(s2);

            stripes.push(s1, s2);
        }

        // 4. Create 3D Player Car / Super Hero Vehicle
        const playerGroup = new THREE.Group();
        
        // Car Body
        const bodyGeo = new THREE.BoxGeometry(1.4, 0.6, 2.6);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff4757 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.5;
        body.castShadow = true;
        playerGroup.add(body);

        // Car Cabin
        const cabinGeo = new THREE.BoxGeometry(1.1, 0.5, 1.3);
        const cabinMat = new THREE.MeshStandardMaterial({ color: 0x1e90ff });
        const cabin = new THREE.Mesh(cabinGeo, cabinMat);
        cabin.position.set(0, 0.95, -0.1);
        cabin.castShadow = true;
        playerGroup.add(cabin);

        scene.add(playerGroup);

        // 5. Game Logic Variables
        const lanes = [-3.2, 0, 3.2]; // Left, Center, Right 3D X-positions
        let currentLane = 1;
        let targetX = lanes[currentLane];
        let isPlaying = false;
        let score = 0;
        let highScore = localStorage.getItem('heavy_3d_high') || 0;
        let speed = 0.45;
        let obstacles = [];
        let spawnCounter = 0;

        document.getElementById('highVal').innerText = highScore;

        const dialogues = [
            "अरे भैया, 3D में भी ठोक दी!",
            "इंदौर के ट्रैफिक से बचना मुश्किल है!",
            "हेवी ड्राइवर बनते-बनते रह गए!",
            "थोड़ा ब्रेक भी मार लिया करो!"
        ];

        // Controls
        document.addEventListener('keydown', (e) => {
            if (!isPlaying) return;
            if (e.key === 'ArrowLeft' || e.key === 'a') moveLeft();
            if (e.key === 'ArrowRight' || e.key === 'd') moveRight();
        });

        function moveLeft() {
            if (isPlaying && currentLane > 0) {
                currentLane--;
                targetX = lanes[currentLane];
            }
        }

        function moveRight() {
            if (isPlaying && currentLane < 2) {
                currentLane++;
                targetX = lanes[currentLane];
            }
        }

        function startGame() {
            obstacles.forEach(obs => scene.remove(obs.mesh));
            obstacles = [];
            score = 0;
            speed = 0.45;
            currentLane = 1;
            targetX = lanes[currentLane];
            playerGroup.position.x = targetX;
            document.getElementById('scoreVal').innerText = '0';

            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('gameOverScreen').style.display = 'none';
            isPlaying = true;
        }

        function spawnObstacle() {
            const laneIdx = Math.floor(Math.random() * 3);
            const colors = [0xffa502, 0x3742fa, 0x7bed9f, 0xeccc68];
            const randColor = colors[Math.floor(Math.random() * colors.length)];

            // 3D Truck / Traffic Block
            const obsGeo = new THREE.BoxGeometry(1.6, 1.4, 2.8);
            const obsMat = new THREE.MeshStandardMaterial({ color: randColor });
            const obsMesh = new THREE.Mesh(obsGeo, obsMat);
            obsMesh.position.set(lanes[laneIdx], 0.7, -85);
            obsMesh.castShadow = true;
            scene.add(obsMesh);

            obstacles.push({ mesh: obsMesh, lane: laneIdx });
        }

        function gameOver() {
            isPlaying = false;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('heavy_3d_high', highScore);
                document.getElementById('highVal').innerText = highScore;
            }
            document.getElementById('finalScore').innerText = score;
            document.getElementById('funnyDialogue').innerText = dialogues[Math.floor(Math.random() * dialogues.length)];
            document.getElementById('gameOverScreen').style.display = 'flex';
        }

        // 6. Main 3D Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            if (isPlaying) {
                // Smooth Car Lane Switching & Tilt Effect
                playerGroup.position.x += (targetX - playerGroup.position.x) * 0.18;
                playerGroup.rotation.z = (playerGroup.position.x - targetX) * 0.15;

                // Move Road Stripes
                stripes.forEach(s => {
                    s.position.z += speed;
                    if (s.position.z > 12) s.position.z = -148;
                });

                // Spawn Traffic
                spawnCounter++;
                if (spawnCounter > Math.max(22, 55 - Math.floor(score / 40))) {
                    spawnObstacle();
                    spawnCounter = 0;
                }

                // Update Obstacles & Collision Detection
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i];
                    obs.mesh.position.z += speed;

                    // Check 3D Collision
                    if (obs.mesh.position.z > -1.8 && obs.mesh.position.z < 1.8) {
                        if (Math.abs(playerGroup.position.x - obs.mesh.position.x) < 1.3) {
                            gameOver();
                        }
                    }

                    // Passed Obstacle
                    if (obs.mesh.position.z > 12) {
                        scene.remove(obs.mesh);
                        obstacles.splice(i, 1);
                        score += 10;
                        document.getElementById('scoreVal').innerText = score;

                        // Gradually Increase Speed
                        if (score % 50 === 0 && speed < 1.2) {
                            speed += 0.05;
                        }
                    }
                }
            }

            renderer.render(scene, camera);
        }

        // Handle Screen Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
