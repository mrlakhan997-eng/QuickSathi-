<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Sathi - Delivery App</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --primary: #ff4757;
            --bg-color: #f5f6fa;
            --card-bg: #ffffff;
            --text-color: #333;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 10px;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            overflow: hidden;
            padding-bottom: 25px;
        }
        header {
            background: var(--primary);
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
        }
        header h1 {
            font-size: 22px;
            margin-bottom: 4px;
        }
        header p {
            font-size: 13px;
            opacity: 0.9;
        }
        .nav-tabs {
            display: flex;
            background: #f1f2f6;
            margin: 15px;
            border-radius: 10px;
            overflow: hidden;
        }
        .nav-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            color: #718093;
        }
        .nav-tab.active {
            background: var(--primary);
            color: white;
        }
        .section-content {
            display: none;
            padding: 0 20px;
        }
        .section-content.active {
            display: block;
        }
        .input-group {
            margin-bottom: 15px;
            position: relative;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 13px;
            color: #4b6584;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        .gps-btn {
            background: #2ed573;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            font-size: 11px;
            cursor: pointer;
            margin-top: 5px;
            display: inline-block;
        }
        .suggestions-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #dcdde1;
            border-radius: 0 0 8px 8px;
            max-height: 150px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }
        .suggestion-item {
            padding: 10px;
            font-size: 13px;
            cursor: pointer;
            border-bottom: 1px solid #f1f2f6;
        }
        .suggestion-item:hover {
            background-color: #f8f9fa;
        }
        /* Live Map Container */
        .map-box {
            width: 100%;
            height: 150px;
            border-radius: 8px;
            margin-top: 6px;
            border: 1px solid #ced6e0;
        }
        .fare-box {
            background: #f1f2f6;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .fare-box span {
            font-size: 15px;
            font-weight: bold;
        }
        #totalFare {
            color: var(--primary);
            font-size: 18px;
        }
        .btn-main {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        .profile-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid var(--primary);
        }
        .otp-display {
            background: #fff0f1;
            border: 1px dashed var(--primary);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-top: 15px;
            display: none;
        }
        .otp-display h3 {
            color: var(--primary);
            font-size: 18px;
            letter-spacing: 2px;
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>📦 Quick Sathi</h1>
        <p>Aapka Apna Smart Live Delivery Partner</p>
    </header>

    <div class="nav-tabs">
        <div class="nav-tab active" onclick="switchTab('book', this)">Book Parcel</div>
        <div class="nav-tab" onclick="switchTab('profile', this)">My Profile</div>
    </div>

    <!-- BOOK PARCEL TAB -->
    <div id="bookSection" class="section-content active">
        
        <div class="input-group">
            <label>📍 Pickup Location (Kahan se lana hai?)</label>
            <input type="text" id="pickupLoc" placeholder="City ya area ka naam likhein..." oninput="showSuggestions(this.value, 'pickup')" autocomplete="off">
            <div id="pickupSuggestions" class="suggestions-list"></div>
            <button class="gps-btn" onclick="useCurrentLocation()">📍 Use My Current Location</button>
            <div id="pickupMap" class="map-box"></div>
        </div>

        <div class="input-group">
            <label>🎯 Drop Location (Kahan bhejna hai?)</label>
            <input type="text" id="dropLoc" placeholder="Manzil city ya area likhein..." oninput="showSuggestions(this.value, 'drop')" autocomplete="off">
            <div id="dropSuggestions" class="suggestions-list"></div>
            <div id="dropMap" class="map-box"></div>
        </div>

        <div class="input-group">
            <label>📏 Parcel ka Size & Details</label>
            <select id="parcelSize" onchange="calculateFare()">
                <option value="small">Small (Documents, Keys - upto 2kg)</option>
                <option value="medium">Medium (Box, Clothes - 2 to 5kg)</option>
                <option value="large">Large (Heavy Item / Big Box - 5kg+)</option>
            </select>
        </div>

        <div class="fare-box">
            <span>Estimated Kiraya:</span>
            <span id="totalFare">₹ 50</span>
        </div>

        <button class="btn-main" onclick="bookParcel()">Book Parcel & Get Secure OTP 🚀</button>

        <div id="otpBox" class="otp-display">
            <span style="font-size: 13px; font-weight: 600; color: #333;">🔒 Delivery Security OTP:</span>
            <h3 id="generatedOtp">----</h3>
            <p style="font-size: 11px; color: #666; margin-top: 4px;">Parcel deliver hote waqt delivery boy ko ye OTP batayein.</p>
        </div>
    </div>

    <!-- PROFILE TAB -->
    <div id="profileSection" class="section-content">
        <div class="profile-card">
            <h3 style="margin-bottom: 10px; color: #2f3640;">👤 User Profile</h3>
            <div class="input-group">
                <label>Aapka Naam</label>
                <input type="text" id="userName" placeholder="Apna pura naam likhein">
            </div>
            <div class="input-group">
                <label>Mobile Number</label>
                <input type="tel" id="userPhone" placeholder="10-digit mobile number">
            </div>
            <button class="btn-main" onclick="saveProfile()">Save Profile 💾</button>
        </div>
    </div>

</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
