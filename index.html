<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Sathi - Customer App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f5f6fa;
            color: #333;
            padding: 15px;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        header {
            background: #ff4757;
            color: white;
            padding: 20px;
            text-align: center;
        }
        header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        header p {
            font-size: 14px;
            opacity: 0.9;
        }
        .form-section {
            padding: 20px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 14px;
            color: #555;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border 0.3s;
        }
        input:focus, select:focus {
            border-color: #ff4757;
        }
        .services-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        .service-card {
            border: 2px solid #dcdde1;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .service-card.active {
            border-color: #ff4757;
            background-color: #ffe4e6;
            color: #ff4757;
        }
        .fare-box {
            background: #f1f2f6;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .fare-box span {
            font-size: 16px;
            font-weight: bold;
            color: #2f3640;
        }
        #totalFare {
            color: #ff4757;
            font-size: 20px;
        }
        .btn-book {
            width: 100%;
            background: #ff4757;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-book:hover {
            background: #ff6b81;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Quick Sathi</h1>
        <p>Aapka Apna Local Delivery & Emergency Partner</p>
    </header>

    <div class="form-section">
        <!-- Service Type Selection -->
        <div class="input-group">
            <label>Aapko kya sahayata chahiye?</label>
            <div class="services-grid">
                <div class="service-card active" onclick="selectService('parcel', this)">📦 Parcel / Delivery</div>
                <div class="service-card" onclick="selectService('petrol', this)">⛽ Petrol Delivery</div>
                <div class="service-card" onclick="selectService('mechanic', this)">🔧 Puncture / Mechanic</div>
                <div class="service-card" onclick="selectService('other', this)">🛍️ Custom Task</div>
            </div>
        </div>

        <!-- Pickup Location -->
        <div class="input-group">
            <label>📍 Pickup Location (Kahan se?)</label>
            <input type="text" id="pickup" placeholder="Apna current address ya landmark dalein">
        </div>

        <!-- Drop Location -->
        <div class="input-group" id="dropGroup">
            <label>🎯 Drop Location (Kahan bhejna hai?)</label>
            <input type="text" id="drop" placeholder="Manzil ka pata dalein">
        </div>

        <!-- Parcel Size / Extra Details -->
        <div class="input-group" id="parcelSizeGroup">
            <label>📏 Parcel ka Size / Vajan</label>
            <select id="parcelSize" onchange="calculateFare()">
                <option value="small">Chhota (Documents, Keys - 0 to 2 kg)</option>
                <option value="medium">Medium (Box, Clothes - 2 to 5 kg)</option>
                <option value="large">Bada (Heavy bag / Large box - 5+ kg)</option>
            </select>
        </div>

        <!-- Estimated Fare Show Box -->
        <div class="fare-box">
            <span>Estimated Kiraya:</span>
            <span id="totalFare">₹ 49</span>
        </div>

        <!-- Book Button -->
        <button class="btn-book" onclick="bookService()">Book Now 🚀</button>
    </div>
</div>

<script>
    let currentService = 'parcel';

    function selectService(service, element) {
        currentService = service;
        
        // Remove active class from all cards
        document.querySelectorAll('.service-card').forEach(card => card.classList.remove('active'));
        // Add active to clicked card
        element.classList.add('active');

        // Hide/Show fields based on service
        const dropGroup = document.getElementById('dropGroup');
        const parcelSizeGroup = document.getElementById('parcelSizeGroup');

        if (service === 'petrol' || service === 'mechanic') {
            dropGroup.style.display = 'none';
            parcelSizeGroup.style.display = 'none';
            document.getElementById('totalFare').innerText = service === 'petrol' ? '₹ 79 + Fuel Cost' : '₹ 99';
        } else {
            dropGroup.style.display = 'block';
            parcelSizeGroup.style.display = 'block';
            calculateFare();
        }
    }

    function calculateFare() {
        if(currentService !== 'parcel' && currentService !== 'other') return;
        
        const size = document.getElementById('parcelSize').value;
        let basePrice = 40;
        
        if (size === 'medium') basePrice = 70;
        if (size === 'large') basePrice = 110;

        document.getElementById('totalFare').innerText = '₹ ' + basePrice;
    }

    function bookService() {
        const pickup = document.getElementById('pickup').value;
        if(!pickup) {
            alert('Kripya pickup location darj karein!');
            return;
        }
        alert('Aapki booking safal rahi! Quick Sathi partner jald hi aapse sampark karega.');
    }
</script>

</body>
</html>
